name: Coleta diaria

on:
  schedule:
    # Horarios em UTC. Brasilia = UTC-3 (sem horario de verao atualmente).
    - cron: "0 22 * * 1-5"  # 19:00 BRT, seg-sex — apos o fechamento da B3
  workflow_dispatch:
    inputs:
      force_update_tickers:
        description: "Forcar atualizacao da lista de tickers do IBrA (mesmo se ainda estiver recente)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: acoes-fundamentalista-diario
  cancel-in-progress: false

jobs:
  coleta:
    # Runner proprio (28/08) -- fila compartilhada do GitHub Actions
    # atrasou rodadas por horas em varios repos nessa semana. VPS
    # dedicada (mesma maquina do omqs_futuros_5tf), sem fila.
    runs-on: [self-hosted, self-hosted-acoes_fundamentalista]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coletar fundamentos do dia (download_fundamentals.py)
        env:
          FORCE_UPDATE: ${{ inputs.force_update_tickers == true && '1' || '' }}
        run: python scripts/download_fundamentals.py

      - name: Gerar panorama do dia (gerar_panorama.py)
        run: python scripts/gerar_panorama.py

      - name: Commit e push dos resultados
        run: |
          git config user.name "acoes-fundamentalista-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados tickers
          git diff --cached --quiet && exit 0
          git commit -m "coleta automatica $(date -u +'%Y-%m-%d %H:%M UTC')"
          # download_fundamentals.py demora o bastante (150+ tickers no
          # Yahoo Finance) pra alguém empurrar outro commit pro main
          # enquanto o job roda -- rebase antes do push em vez de um git
          # push cru, senão a rodada inteira (7+min de coleta) se perde
          # com "! [rejected] ... (fetch first)" (aconteceu em 25/08,
          # commit manual concorrente durante teste).
          git fetch origin main
          git rebase origin/main
          git push
