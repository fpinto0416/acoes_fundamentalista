name: Coleta diaria

on:
  # on:schedule removido em 31/08 -- provou ser fonte de risco, nao
  # rede de seguranca: hoje disparou ~7h atrasado no opcoes-sinal-diario
  # (2a mensagem Telegram duplicada) e nao disparou nenhuma vez no hilo
  # (repo que ainda depende so dele). O cron da VPS (workflow_dispatch
  # via gh workflow run) e o gatilho real desde 28/08 -- ver CLAUDE.md.
  workflow_dispatch:
    inputs:
      force_update_tickers:
        description: "Forcar atualizacao da lista de tickers do IBrA (mesmo se ainda estiver recente)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: acoes-fundamentalista-diario
  cancel-in-progress: false

jobs:
  coleta:
    # Runner proprio (28/08) -- fila compartilhada do GitHub Actions
    # atrasou rodadas por horas em varios repos nessa semana. VPS
    # dedicada (mesma maquina do omqs_futuros_5tf), sem fila.
    runs-on: [self-hosted, self-hosted-acoes_fundamentalista]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coletar fundamentos do dia (download_fundamentals.py)
        env:
          FORCE_UPDATE: ${{ inputs.force_update_tickers == true && '1' || '' }}
        run: python scripts/download_fundamentals.py

      - name: Gerar panorama do dia (gerar_panorama.py)
        run: python scripts/gerar_panorama.py

      # Teste de convergencia preco->alvo. Acumula uma janela no placar a
      # cada ~21 pregoes; o poder estatistico cresce sozinho com o tempo.
      # continue-on-error de proposito: este passo e acessorio e NUNCA
      # pode derrubar a coleta do dia, que e o produto real do repo (e,
      # com runner efemero, uma rodada perdida nao volta -- ver CLAUDE.md).
      # O 1o run baixa ~4 anos x 152 tickers e demora; depois e incremental.
      - name: Atualizar placar de convergencia (analise_upside.py)
        continue-on-error: true
        run: python scripts/analise_upside.py

      - name: Commit e push dos resultados
        run: |
          git config user.name "acoes-fundamentalista-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados tickers
          git diff --cached --quiet && exit 0
          git commit -m "coleta automatica $(date -u +'%Y-%m-%d %H:%M UTC')"
          # download_fundamentals.py demora o bastante (150+ tickers no
          # Yahoo Finance) pra alguém empurrar outro commit pro main
          # enquanto o job roda -- rebase antes do push em vez de um git
          # push cru, senão a rodada inteira (7+min de coleta) se perde
          # com "! [rejected] ... (fetch first)" (aconteceu em 25/08,
          # commit manual concorrente durante teste).
          git fetch origin main
          git rebase origin/main
          git push
