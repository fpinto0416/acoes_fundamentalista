name: Coleta diaria

on:
  # 25/11/2026: gatilho NOTURNO. O schedule do GitHub atrasou 7-11 h em
  # 24-25/11; disparando a partir das 18-21h BRT, mesmo com 12 h de atraso a
  # rodada sai antes do pregao seguinte abrir. Ver o job `guarda`. Historico abaixo.
  schedule:
    - cron: "7 22 * * 1-5"   # 19:07 BRT
    - cron: "7 1 * * 2-6"   # 22:07 BRT
    - cron: "7 4 * * 2-6"   # 01:07 BRT
    - cron: "7 7 * * 2-6"   # 04:07 BRT
  # on:schedule removido em 31/08 -- provou ser fonte de risco, nao
  # rede de seguranca: hoje disparou ~7h atrasado no opcoes-sinal-diario
  # (2a mensagem Telegram duplicada) e nao disparou nenhuma vez no hilo
  # (repo que ainda depende so dele). O cron da VPS (workflow_dispatch
  # via gh workflow run) e o gatilho real desde 28/08 -- ver CLAUDE.md.
  workflow_dispatch:
    inputs:
      forcar:
        description: "Rodar mesmo se ja houve rodada hoje / fora da janela"
        type: boolean
        default: false
      teste:
        description: "Teste: coleta e gera o panorama sem commitar"
        type: boolean
        default: false
      force_update_tickers:
        description: "Forcar atualizacao da lista de tickers do IBrA (mesmo se ainda estiver recente)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: acoes-fundamentalista-diario
  cancel-in-progress: false

jobs:
  # Guarda (25/11/2026). O on:schedule do GitHub atrasou 7-11 h em 24-25/11,
  # entao o gatilho e NOTURNO, com varios horarios, e a rodada vale de
  # 18h ate 9h59 BRT do dia seguinte (antes do pregao abrir).
  #   - dia de referencia = pregao a que a rodada se refere: antes das 9h BRT
  #     e o dia util anterior (seg de madrugada -> sexta);
  #   - schedule fora da janela, ou referencia em fim de semana -> pula;
  #   - ja houve rodada de verdade com sucesso para essa referencia -> pula
  #     (evita Telegram/commit em dobro quando outro horario tambem dispara);
  #   - disparo manual com forcar=true (ou teste=true) -> roda sempre.
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.g.outputs.rodar }}
      ref: ${{ steps.g.outputs.ref }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          FORCAR: ${{ inputs.forcar || inputs.teste }}
          HORA_MIN: "18"
          HORA_MAX: "10"
        run: |
          set -euo pipefail
          hoje=$(TZ=America/Sao_Paulo date +%F)
          hora=$((10#$(TZ=America/Sao_Paulo date +%H)))
          if [ "$hora" -lt 9 ]; then
            case $(date -d "$hoje" +%u) in 1) v=3;; 7) v=2;; *) v=1;; esac
            ref=$(date -d "$hoje -$v day" +%F)
          else
            ref=$hoje
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "agora ${hora}h BRT de $hoje -> referencia $ref"
          if [ "${FORCAR:-false}" = "true" ]; then
            echo "forcar -> roda"; echo "rodar=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENTO" = "schedule" ]; then
            if [ "$hora" -ge "$HORA_MAX" ] && [ "$hora" -lt "$HORA_MIN" ]; then
              echo "fora da janela -> pula"; echo "rodar=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$(date -d "$ref" +%u)" -ge 6 ]; then
              echo "referencia em fim de semana -> pula"; echo "rodar=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          inicio=$(date -u -d "$ref 15:00" +%FT%TZ)   # 12h BRT do dia de referencia
          ja=0
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w "$GITHUB_WORKFLOW" -s success \
                        --created ">=$inicio" -L 50 --json databaseId -q '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                  -q '[.jobs[] | select(.name != "guarda" and .name != "teste" and .conclusion == "success")] | length')
            if [ "$n" -gt 0 ]; then ja=$id; break; fi
          done
          if [ "$ja" != "0" ]; then
            echo "referencia $ref ja rodou na run $ja -> pula"; echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "referencia $ref sem rodada de verdade -> roda"; echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

          fi

  coleta:
    name: ${{ inputs.teste && 'teste' || 'coleta' }}
    needs: guarda
    if: needs.guarda.outputs.rodar == 'true'
    # Os "HTTP Error 404 ... No fundamentals data found" no log sao ruido: a
    # coleta sai completa (conferido no ubuntu-latest em 24/11 pelos dados).
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coletar fundamentos do dia (download_fundamentals.py)
        env:
          FORCE_UPDATE: ${{ inputs.force_update_tickers == true && '1' || '' }}
        # Exige 95% dos tickers (senao falha e o proximo horario tenta de novo),
        # exceto entre 05h e 10h BRT, a ultima chance antes do pregao: ai aceita o que vier.
        run: |
          h=$((10#$(TZ=America/Sao_Paulo date +%H)))
          if [ "$h" -lt 5 ] || [ "$h" -ge 10 ]; then export COBERTURA_MINIMA=0.95; fi
          python scripts/download_fundamentals.py

      - name: Gerar panorama do dia (gerar_panorama.py)
        run: python scripts/gerar_panorama.py

      - name: Commit e push dos resultados
        if: ${{ !inputs.teste }}
        run: |
          git config user.name "acoes-fundamentalista-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados tickers
          git diff --cached --quiet && exit 0
          git commit -m "coleta automatica $(date -u +'%Y-%m-%d %H:%M UTC')"
          # download_fundamentals.py demora o bastante (150+ tickers no
          # Yahoo Finance) pra alguém empurrar outro commit pro main
          # enquanto o job roda -- rebase antes do push em vez de um git
          # push cru, senão a rodada inteira (7+min de coleta) se perde
          # com "! [rejected] ... (fetch first)" (aconteceu em 25/08,
          # commit manual concorrente durante teste).
          git fetch origin main
          git rebase origin/main
          git push
