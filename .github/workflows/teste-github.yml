name: TESTE github (temporario)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/download_fundamentals.py 2>&1 | grep -vc "HTTP Error 404" || true
      - run: python scripts/gerar_panorama.py
      - run: |
          python3 - <<'PY'
          import io, subprocess, pandas as pd
          def ult(df):
              d = df[df["data"] == df["data"].max()]
              return d["data"].iloc[0], d
          novo = pd.read_csv("dados/snapshot_diario.csv")
          velho = pd.read_csv(io.BytesIO(subprocess.run(["git","show","HEAD:dados/snapshot_diario.csv"],capture_output=True,check=True).stdout))
          for nome, df in [("commitado (VPS)", velho), ("teste (GitHub)", novo)]:
              dt, d = ult(df)
              cheios = {c: int(d[c].notna().sum()) for c in ["preco_atual","pl","pvp","roe","dividend_yield","beta"]}
              print(f"{nome}: ultima data {dt}, {len(d)} tickers, preenchidos {cheios}")
          ai_n = pd.read_csv("dados/analyst_insights.csv"); ai_v = pd.read_csv(io.BytesIO(subprocess.run(["git","show","HEAD:dados/analyst_insights.csv"],capture_output=True,check=True).stdout))
          print("analyst_insights colunas:", list(ai_n.columns)[:8])
          tc = [c for c in ai_n.columns if "mean" in c.lower() or "medio" in c.lower() or "alvo" in c.lower()]
          for nome, df in [("commitado", ai_v), ("teste", ai_n)]:
              print(nome, "linhas", len(df), {c: int(df[c].notna().sum()) for c in tc[:3]})
          PY
          git --no-pager diff --stat
